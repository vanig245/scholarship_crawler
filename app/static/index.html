<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scholarship Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1c1c1e}
  header{background:#1f2a44;color:#fff;padding:16px 28px}
  main{max-width:1200px;margin:0 auto;padding:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0001}
  .card b{display:block;font-size:26px}.card span{font-size:12px;color:#666}
  .filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  input,select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px}
  input{flex:1;min-width:200px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}
  th{background:#eef0f4}tr.row{cursor:pointer}tr.row:hover{background:#f0f4ff}
  .badge{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
  .VERIFIED{background:#d7f5df;color:#14612c}.REVIEW{background:#fde9c8;color:#7a4b00}
  .EXPIRED,.NO_LONGER_VERIFIABLE{background:#fbd5d5;color:#7d1a1a}
  #detail{background:#fff;border-radius:10px;padding:20px;margin-top:24px;display:none}
  #detail h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
  h3{margin:20px 0 8px}.small{font-size:13px}
  pre{background:#f1f3f6;padding:10px;border-radius:6px;font-size:12px;overflow:auto}
  a{color:#1a56db;word-break:break-all}
</style>
</head>
<body>
<header><h1 style="margin:0;font-size:20px">Scholarship Intelligence</h1></header>
<main>
  <div class="cards" id="cards"></div>
  <div class="filters">
    <input id="search" placeholder="Search name, provider, income, category...">
    <select id="status"><option value="">All statuses</option>
      <option>ACTIVE</option><option>EXPIRING_SOON</option><option>EXPIRED</option>
      <option>REVIEW_REQUIRED</option><option>NO_LONGER_VERIFIABLE</option></select>
    <select id="label"><option value="">All verification</option>
      <option>VERIFIED</option><option>REVIEW REQUIRED</option></select>
    <select id="stype"><option value="">All source types</option>
      <option>GOVERNMENT</option><option>UNIVERSITY</option><option>CORPORATE_CSR</option>
      <option>NGO_TRUST</option><option>PROVIDER_SITE</option></select>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Provider</th><th>Amount</th><th>Deadline</th>
      <th>Status</th><th>Verification</th><th>Confidence</th><th>Source type</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="detail"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ns = v => (v === null || v === undefined || v === "") ? "Not specified" : esc(v);
const link = u => /^https?:\/\//i.test(u || "")
  ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>` : "Not specified";
const badge = (t, cls) => `<span class="badge ${esc((cls || t).split(" ")[0])}">${esc(t)}</span>`;
const get = async u => (await fetch(u)).json();

async function loadStats() {
  const s = await get("/api/stats");
  const items = [["Total discovered", s.total], ["Verified", s.verified], ["Review required", s.review],
    ["Active", s.active], ["Expired", s.expired], ["No longer verifiable", s.unverifiable],
    ["Recently updated", s.recent], ["Changes logged", s.changes], ["Avg confidence", s.avg_conf + "%"]];
  $("#cards").innerHTML = items.map(([l, v]) => `<div class="card"><b>${esc(v)}</b><span>${l}</span></div>`).join("");
}

async function loadList() {
  const p = new URLSearchParams({search: $("#search").value, status: $("#status").value,
    label: $("#label").value, source_type: $("#stype").value});
  const rows = await get("/api/scholarships?" + p);
  $("#rows").innerHTML = rows.map(r => `<tr class="row" onclick="openDetail(${r.id})">
    <td>${ns(r.name)}</td><td>${ns(r.provider)}</td><td>${ns(r.amount)}</td><td>${ns(r.closing_date)}</td>
    <td>${badge(r.status)}</td><td>${badge(r.verification_label)}</td><td>${r.confidence}%</td>
    <td>${ns(r.source_type)}</td></tr>`).join("") || `<tr><td colspan="8">No records.</td></tr>`;
}

async function openDetail(id) {
  const s = await get("/api/scholarships/" + id);
  const f = [["Income", "income_criteria"], ["Age", "age_criteria"], ["Gender", "gender_criteria"],
    ["Category", "category_criteria"], ["Academic", "academic_requirements"], ["Course / level", "course_level"],
    ["Domicile", "domicile"], ["Institution", "institution_requirements"], ["Documents", "documents_required"],
    ["Selection", "selection_process"], ["Renewal", "renewal_requirements"]];
  const table = (head, rows) => `<table class="small"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("") || `<tr><td colspan="${head.length}">None</td></tr>`}</tbody></table>`;
  $("#detail").style.display = "block";
  $("#detail").innerHTML = `
    <h2>${ns(s.name)}</h2>
    <div class="grid">
      <div><b>Provider:</b> ${ns(s.provider)}</div><div><b>Amount:</b> ${ns(s.amount)}</div>
      <div><b>Opening date:</b> ${ns(s.opening_date)}</div><div><b>Deadline:</b> ${ns(s.closing_date)}</div>
      <div><b>Status:</b> ${badge(s.status)}</div>
      <div><b>Confidence:</b> ${s.confidence}% ${badge(s.verification_label)}</div>
      <div><b>Last verified:</b> ${ns(s.last_verified)}</div><div><b>Source type:</b> ${ns(s.source_type)}</div>
      <div style="grid-column:1/3"><b>Official source:</b> ${link(s.official_source_url)}</div>
      <div style="grid-column:1/3"><b>Application link:</b> ${link(s.application_url)}</div>
    </div>
    <h3>Eligibility</h3>
    ${f.map(([l, c]) => `<div class="small"><b>${l}:</b> ${ns(s[c])}</div>`).join("")}
    <h3>Machine-readable eligibility</h3><pre>${esc(JSON.stringify(s.eligibility, null, 2))}</pre>
    <h3>Why this score?</h3>
    ${table(["Check", "Points", "Max", "Reason"], s.breakdown.map(b =>
      `<tr><td>${esc(b.check)}</td><td>${b.points}</td><td>${b.max}</td><td>${esc(b.reason)}</td></tr>`))}
    <h3>Source evidence</h3>
    ${table(["Field", "Extracted value", "Evidence quote", "Captured"], s.evidence.map(e =>
      `<tr><td>${esc(e.field)}</td><td>${ns(e.value)}</td><td>${ns(e.quote)}</td><td>${esc(e.captured_at)}</td></tr>`))}
    <h3>Change history</h3>
    ${table(["Field", "Old", "New", "Detected", "Evidence"], s.changes.map(c =>
      `<tr><td>${esc(c.field)}</td><td>${ns(c.old_value)}</td><td>${ns(c.new_value)}</td>
       <td>${esc(c.detected_at)}</td><td>${ns(c.evidence_quote)}</td></tr>`))}`;
  $("#detail").scrollIntoView({behavior: "smooth"});
}

["search", "status", "label", "stype"].forEach(id => $("#" + id).addEventListener("input", loadList));
loadStats(); loadList();
</script>
</body>
</html>
